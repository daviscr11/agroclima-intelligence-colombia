name: Actualizar datos oficiales y publicar en Hugging Face

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 15 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restaurar caché
        uses: actions/cache@v4
        with:
          path: .runtime
          key: agroclima-runtime-v1-${{ runner.os }}
          restore-keys: |
            agroclima-runtime-v1-${{ runner.os }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probar formatos de fecha y unidad SIPSA-P
        run: python -m unittest discover -s tests -v

      - name: Descargar datos y estimar modelo
        env:
          AGROCLIMA_FORCE_REFRESH: "1"
          AGROCLIMA_START_YEAR: "2019"
          AGROCLIMA_END_YEAR: "2024"
          AGROCLIMA_MIN_MARKETS: "6"
          AGROCLIMA_MIN_MONTHS: "36"
          AGROCLIMA_MAX_CANDIDATE_PRODUCTS: "24"
          AGROCLIMA_MAX_MARKETS: "12"
          AGROCLIMA_KNN_K: "4"
          AGROCLIMA_IRF_HORIZON: "18"
          AGROCLIMA_IRF_BOOTSTRAP_REPS: "399"
          AGROCLIMA_IRF_BOOTSTRAP_SEED: "20261025"
          AGROCLIMA_BACKTEST_MIN_TRAIN_MONTHS: "36"
          AGROCLIMA_SIPSA_AUDIT_MIN_SCALE_RATIO: "0.1"
          AGROCLIMA_SIPSA_AUDIT_MAX_SCALE_RATIO: "10"
        run: python refresh_static_data.py

      - name: Validar integridad del JSON antes de publicar
        env:
          AGROCLIMA_START_YEAR: "2019"
          AGROCLIMA_END_YEAR: "2024"
          AGROCLIMA_INTEGRITY_MIN_MONTHLY_RATIO: "0.1"
          AGROCLIMA_INTEGRITY_MAX_MONTHLY_RATIO: "10"
        run: python validate_observatorio_integrity.py data/observatorio.json

      - name: Auditar coordenadas de mercados
        env:
          AGROCLIMA_COORD_ONLINE_CHECK: "1"
          AGROCLIMA_COORD_CACHE_TTL_DAYS: "90"
          AGROCLIMA_COORD_REQUEST_INTERVAL: "15.1"
        run: python validate_market_coordinates.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observatorio.json data/market_coordinates.csv data/coordinate_validation_report.csv data/coordinate_validation_cache.json data/sipsa_audit_files.csv data/sipsa_audit_year_product.csv data/sipsa_audit_summary.json data/residual_moran_panel_audit.csv data/spvarx_rolling_backtest.csv
          if [ -f data/colombia_departments.geojson ]; then git add data/colombia_departments.geojson; fi
          if git diff --cached --quiet; then
            echo "No hay cambios para confirmar."
          else
            git commit -m "Actualizar resultados oficiales, residuos y cartografía"
            git push
          fi

      - name: Publicar interfaz, datos y auditorías en Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: python publish_to_hf.py
